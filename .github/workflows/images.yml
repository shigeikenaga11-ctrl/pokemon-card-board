name: Download Pokemon Card Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  images:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install packages
        run: |
          pip install beautifulsoup4


      - name: Download card images
        run: |
          python update_images.py


      - name: Commit images
        run: |

          git config user.name "pokemon-card-bot"

          git config user.email "actions@users.noreply.github.com"

          git add cards.json images/

          git diff --cached --quiet || \
          git commit -m "Add Pokemon card images"

          git push
