name: Update Pokemon Card Prices

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update prices
        run: python update_data.py

      - name: Commit data
        run: |
          git config user.name "pokemon-card-bot"
          git config user.email "actions@users.noreply.github.com"

          git add cards.json

          git diff --cached --quiet || \
          git commit -m "Update Pokemon card prices"

          git push
