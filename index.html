<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Pokémon Card Board</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 15%,#18213a 0%,transparent 38%),
    radial-gradient(circle at 90% 90%,#201323 0%,transparent 35%),
    #06080d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
}

body{
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

#app{
  width:100%;
  height:100%;
  padding:30px 46px;
}

.header{
  height:9%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:17px;
  letter-spacing:4px;
  color:#aeb7c5;
  font-weight:700;
}

.clock{
  font-size:14px;
  color:#697485;
}

.main{
  height:84%;
  display:grid;
  grid-template-columns:32% 68%;
  gap:36px;
}

.image-area{
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translateY(-35px);
}

.card-frame{
  width:min(100%,330px);
  aspect-ratio:63/88;
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.17);
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.09),
    rgba(255,255,255,.02)
  );
  box-shadow:0 25px 60px rgba(0,0,0,.5);
  display:flex;
  align-items:center;
  justify-content:center;
}

.card-frame img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.placeholder{
  text-align:center;
  color:#687382;
  line-height:1.8;
}

.info{
  padding-top:3%;
  display:flex;
  flex-direction:column;
}

.name{
  font-size:clamp(34px,4vw,54px);
  font-weight:760;
}

.number{
  color:#8994a4;
  font-size:18px;
  margin-top:5px;
}

.rule{
  height:1px;
  margin:22px 0;
  background:linear-gradient(
    90deg,
    rgba(255,255,255,.2),
    transparent
  );
}

.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 35px;
}

.metric{
  padding:9px 0;
}

.label{
  font-size:12px;
  letter-spacing:1.5px;
  color:#778291;
}

.value{
  font-size:clamp(25px,3vw,39px);
  font-weight:720;
  margin-top:5px;
}

.sub{
  margin-top:3px;
  font-size:15px;
}

.up{color:#52d798}
.down{color:#ff6d7d}
.neutral{color:#aeb7c4}
.gold{color:#dfc26e}

.graph{
  flex:1;
  min-height:150px;
  margin-top:12px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:17px;
  background:rgba(255,255,255,.025);
  padding:14px 18px;
}

.graph-title{
  color:#697484;
  letter-spacing:2px;
  font-size:11px;
}

canvas{
  width:100%;
  height:calc(100% - 18px);
}

.footer{
  height:7%;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  color:#596371;
  font-size:12px;
  letter-spacing:1px;
}

.mode-owned{
  color:#8fa5c9;
}

.mode-wanted{
  color:#d9bd69;
}
</style>
</head>

<body>

<div id="app">

  <div class="header">
    <div id="headerTitle" class="title">MY COLLECTION</div>
    <div id="clock" class="clock"></div>
  </div>

  <div class="main">

    <div class="image-area">
      <div id="cardFrame" class="card-frame"></div>
    </div>

    <div class="info">

      <div id="cardName" class="name"></div>
      <div id="cardNumber" class="number"></div>

      <div class="rule"></div>

      <div id="metrics" class="metrics"></div>

      <div class="graph">
        <div id="graphTitle" class="graph-title">
          PRICE HISTORY
        </div>
        <canvas id="chart"></canvas>
      </div>

    </div>
  </div>

  <div class="footer">
    <div id="count"></div>
    <div>AUTO ROTATE · 16 SEC</div>
  </div>

</div>

<script>

const PAGE_INTERVAL = 16000;

let data;
let physicalCards = [];

let lastOwnedIndex = -1;
let wantedIndex = 0;

/*
  0 = 保有カード
  1 = WANT
  2 = 保有カード
  3 = WANT
*/
let modeCounter = 0;


/* -------------------------
   基本表示
------------------------- */

function yen(v){

  if(v === null || v === undefined)
    return "—";

  return "¥" +
    Math.round(v).toLocaleString("ja-JP");
}


function pct(v){

  if(v === null || !isFinite(v))
    return "—";

  return (v > 0 ? "+" : "") +
    v.toFixed(1) + "%";
}


function cls(v){

  if(v === null || v === 0)
    return "neutral";

  return v > 0 ? "up" : "down";
}


function signedYen(v){

  if(v === null)
    return "—";

  if(v > 0)
    return "+" + yen(v);

  if(v < 0)
    return "-" + yen(Math.abs(v));

  return "¥0";
}


/* -------------------------
   120枚へ展開
------------------------- */

function expandOwnedCards(){

  physicalCards = [];

  data.owned.forEach(card => {

    for(let i=0; i<card.qty; i++){

      physicalCards.push({

        ...card,

        copy:i + 1,

        purchasePrice:
          card.purchasePrices?.[i] ??
          card.purchasePrices?.[0] ??
          null,

        currentPrice:
          card.currentPrice ?? null,

        yesterdayPrice:
          card.yesterdayPrice ?? null,

        image:
          card.image ?? ""
      });

    }

  });

}


/* -------------------------
   画像
------------------------- */

function showImage(card){

  const frame =
    document.getElementById("cardFrame");

  if(card.image){

    frame.innerHTML =
      `<img src="${card.image}"
            alt="${card.name}">`;

  }else{

    frame.innerHTML = `
      <div class="placeholder">
        CARD IMAGE<br><br>
        ${card.name}<br>
        ${card.number}
      </div>
    `;

  }

}


/* -------------------------
   保有カード
------------------------- */

function randomOwned(){

  if(physicalCards.length === 0)
    return;

  let index;

  do{

    index =
      Math.floor(
        Math.random() *
        physicalCards.length
      );

  }while(
    physicalCards.length > 1 &&
    index === lastOwnedIndex
  );

  lastOwnedIndex = index;

  showOwned(
    physicalCards[index]
  );

}


function showOwned(card){

  document.getElementById(
    "headerTitle"
  ).innerHTML =
    `<span class="mode-owned">
      MY COLLECTION
     </span>`;

  document.getElementById(
    "cardName"
  ).textContent =
    card.name;

  document.getElementById(
    "cardNumber"
  ).textContent =
    card.number +
    (card.qty > 1
      ? ` · ${card.copy}/${card.qty}`
      : "");

  showImage(card);


  const purchase =
    card.purchasePrice;

  const current =
    card.currentPrice;

  const yesterday =
    card.yesterdayPrice;


  const fromPurchase =
    purchase !== null &&
    current !== null
      ? current - purchase
      : null;


  const fromPurchasePct =
    purchase &&
    current !== null
      ? (
          (current / purchase) - 1
        ) * 100
      : null;


  const fromYesterday =
    yesterday !== null &&
    current !== null
      ? current - yesterday
      : null;


  const fromYesterdayPct =
    yesterday &&
    current !== null
      ? (
          (current / yesterday) - 1
        ) * 100
      : null;


  document.getElementById(
    "metrics"
  ).innerHTML = `

    <div class="metric">
      <div class="label">
        購入価格
      </div>

      <div class="value">
        ${yen(purchase)}
      </div>
    </div>


    <div class="metric">
      <div class="label">
        現在相場
      </div>

      <div class="value">
        ${yen(current)}
      </div>
    </div>


    <div class="metric">

      <div class="label">
        購入時から
      </div>

      <div class="value
                  ${cls(fromPurchase)}">

        ${signedYen(fromPurchase)}

      </div>

      <div class="sub
                  ${cls(fromPurchasePct)}">

        ${pct(fromPurchasePct)}

      </div>

    </div>


    <div class="metric">

      <div class="label">
        昨日から
      </div>

      <div class="value
                  ${cls(fromYesterday)}">

        ${signedYen(fromYesterday)}

      </div>

      <div class="sub
                  ${cls(fromYesterdayPct)}">

        ${pct(fromYesterdayPct)}

      </div>

    </div>
  `;


  document.getElementById(
    "graphTitle"
  ).textContent =
    "PRICE HISTORY / PURCHASE";


  document.getElementById(
    "count"
  ).textContent =
    `OWNED ${physicalCards.length} CARDS`;


  drawChart({
    purchase,
    current,
    yesterday,
    target:null
  });

}


/* -------------------------
   WANT LIST
------------------------- */

function showNextWanted(){

  if(data.wanted.length === 0)
    return;

  const card =
    data.wanted[wantedIndex];

  wantedIndex =
    (wantedIndex + 1) %
    data.wanted.length;

  showWanted(card);

}


function showWanted(card){

  document.getElementById(
    "headerTitle"
  ).innerHTML =
    `<span class="mode-wanted">
      WANT LIST
     </span>`;

  document.getElementById(
    "cardName"
  ).textContent =
    card.name;

  document.getElementById(
    "cardNumber"
  ).textContent =
    card.number;

  showImage(card);


  const current =
    card.currentPrice;

  const reference =
    card.referencePrice;

  const yesterday =
    card.yesterdayPrice;


  /*
    登録時価格の50%。
    referencePriceは今後固定する。
  */

  const target =
    reference !== null
      ? reference * 0.5
      : null;


  const dayDiff =
    current !== null &&
    yesterday !== null
      ? current - yesterday
      : null;


  const dayPct =
    current !== null &&
    yesterday
      ? (
          (current / yesterday) - 1
        ) * 100
      : null;


  const targetDiff =
    current !== null &&
    target !== null
      ? current - target
      : null;


  let targetStatus = "—";

  if(
    current !== null &&
    target !== null
  ){

    const ratio =
      current / target;

    if(ratio <= 1)
      targetStatus =
        "BUY ZONE";

    else if(ratio <= 1.10)
      targetStatus =
        "NEAR BUY";

    else if(ratio <= 1.25)
      targetStatus =
        "WATCH";

    else
      targetStatus =
        "WAIT";
  }


  document.getElementById(
    "metrics"
  ).innerHTML = `

    <div class="metric">

      <div class="label">
        現在相場
      </div>

      <div class="value">
        ${yen(current)}
      </div>

    </div>


    <div class="metric">

      <div class="label">
        狙い価格
      </div>

      <div class="value gold">
        ${yen(target)}
      </div>

      <div class="sub gold">
        登録時相場 × 50%
      </div>

    </div>


    <div class="metric">

      <div class="label">
        昨日から
      </div>

      <div class="value
                  ${cls(dayDiff)}">

        ${signedYen(dayDiff)}

      </div>

      <div class="sub
                  ${cls(dayPct)}">

        ${pct(dayPct)}

      </div>

    </div>


    <div class="metric">

      <div class="label">
        狙い価格まで
      </div>

      <div class="value">
        ${
          targetDiff === null
          ? "—"
          : yen(
              Math.max(
                targetDiff,
                0
              )
            )
        }
      </div>

      <div class="sub gold">
        ${targetStatus}
      </div>

    </div>

  `;


  document.getElementById(
    "graphTitle"
  ).textContent =
    "PRICE HISTORY / TARGET";


  document.getElementById(
    "count"
  ).textContent =
    `WANT ${data.wanted.length} CARDS`;


  drawChart({
    purchase:null,
    current,
    yesterday,
    target
  });

}


/* -------------------------
   グラフ
------------------------- */

function drawChart({
  purchase,
  current,
  yesterday,
  target
}){

  const canvas =
    document.getElementById("chart");

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;


  const ctx =
    canvas.getContext("2d");

  ctx.scale(
    ratio,
    ratio
  );


  const w =
    rect.width;

  const h =
    rect.height;


  const values =
    [
      purchase,
      current,
      yesterday,
      target
    ].filter(
      v =>
        v !== null &&
        v !== undefined &&
        isFinite(v)
    );


  ctx.clearRect(
    0,0,w,h
  );


  if(values.length === 0){

    ctx.fillStyle =
      "#606b79";

    ctx.font =
      "14px -apple-system";

    ctx.fillText(
      "価格データを取得するとグラフを表示します",
      20,
      h / 2
    );

    return;
  }


  let min =
    Math.min(...values) * .82;

  let max =
    Math.max(...values) * 1.18;


  if(min === max)
    max = min + 1;


  const y = value =>
    h - 25 -
    (
      (value - min) /
      (max - min)
    ) *
    (h - 50);


  /*
    grid
  */

  ctx.strokeStyle =
    "rgba(255,255,255,.07)";

  ctx.lineWidth = 1;


  for(let i=0;i<4;i++){

    const gy =
      12 +
      ((h - 35) / 3) * i;

    ctx.beginPath();

    ctx.moveTo(
      0,
      gy
    );

    ctx.lineTo(
      w,
      gy
    );

    ctx.stroke();

  }


  /*
    購入価格
  */

  if(purchase !== null){

    ctx.strokeStyle =
      "rgba(255,255,255,.35)";

    ctx.setLineDash(
      [6,6]
    );

    ctx.beginPath();

    ctx.moveTo(
      0,
      y(purchase)
    );

    ctx.lineTo(
      w,
      y(purchase)
    );

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.fillStyle =
      "#9ba5b3";

    ctx.font =
      "12px -apple-system";

    ctx.fillText(
      "PURCHASE " +
      yen(purchase),
      10,
      y(purchase) - 7
    );

  }


  /*
    WANT target
  */

  if(target !== null){

    ctx.strokeStyle =
      "#c4a95e";

    ctx.setLineDash(
      [7,7]
    );

    ctx.beginPath();

    ctx.moveTo(
      0,
      y(target)
    );

    ctx.lineTo(
      w,
      y(target)
    );

    ctx.stroke();

    ctx.setLineDash([]);


    ctx.fillStyle =
      "#dec16c";

    ctx.font =
      "12px -apple-system";

    ctx.fillText(
      "TARGET " +
      yen(target),
      10,
      y(target) - 7
    );

  }


  /*
    yesterday → today
  */

  if(
    yesterday !== null &&
    current !== null
  ){

    const x1 =
      w * .27;

    const x2 =
      w * .76;


    ctx.strokeStyle =
      "#e0e6ef";

    ctx.lineWidth = 3;


    ctx.beginPath();

    ctx.moveTo(
      x1,
      y(yesterday)
    );

    ctx.lineTo(
      x2,
      y(current)
    );

    ctx.stroke();


    ctx.fillStyle =
      "#fff";


    ctx.beginPath();

    ctx.arc(
      x1,
      y(yesterday),
      5,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      x2,
      y(current),
      5,
      0,
      Math.PI * 2
    );

    ctx.fill();


    ctx.fillStyle =
      "#778291";

    ctx.font =
      "11px -apple-system";


    ctx.fillText(
      "YESTERDAY",
      x1 - 32,
      h - 4
    );


    ctx.fillText(
      "TODAY",
      x2 - 16,
      h - 4
    );

  }

}


/* -------------------------
   画面ローテーション
------------------------- */

function nextScreen(){

  /*
    3回中2回は保有カード
    3回中1回はWANT
  */

  if(modeCounter % 3 === 2){

    showNextWanted();

  }else{

    randomOwned();

  }

  modeCounter++;

}


/* -------------------------
   時計
------------------------- */

function updateClock(){

  const now =
    new Date();

  document.getElementById(
    "clock"
  ).textContent =
    now.toLocaleString(
      "ja-JP",
      {
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* -------------------------
   起動
------------------------- */

async function start(){

  const response =
    await fetch(
      "cards.json?t=" +
      Date.now()
    );

  data =
    await response.json();


  expandOwnedCards();


  /*
    数がおかしければ
    ブラウザのConsoleにも出る
  */

  console.log(
    "保有カード:",
    physicalCards.length
  );


  updateClock();

  setInterval(
    updateClock,
    30000
  );


  randomOwned();


  setInterval(
    nextScreen,
    PAGE_INTERVAL
  );

}


window.addEventListener(
  "resize",
  () => nextScreen()
);


start();

</script>

</body>
</html>
