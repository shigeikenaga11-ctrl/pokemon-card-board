<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Pokémon Card Board</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 0%,
      #17202b 0%,
      #080c12 42%,
      #030507 100%
    );

  color:#eef2f6;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}


/* =========================
   BOARD
========================= */

.board{
  width:100%;
  height:100%;

  display:grid;

  grid-template-rows:
    74px
    1fr
    48px;

  padding:
    14px
    24px
    14px;

  gap:12px;
}


/* =========================
   HEADER
========================= */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  border-bottom:
    1px solid rgba(255,255,255,.10);

  padding:
    0 4px 10px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:12px;
  height:42px;

  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      #e0c875,
      #846c27
    );

  box-shadow:
    0 0 18px rgba(221,193,98,.25);
}

.brand-title{
  font-size:25px;
  font-weight:700;

  letter-spacing:.08em;
}

.brand-sub{
  margin-top:3px;

  font-size:10px;

  letter-spacing:.22em;

  color:#717c8b;
}

.mode{
  min-width:126px;

  padding:
    10px 18px;

  border:
    1px solid rgba(255,255,255,.14);

  border-radius:999px;

  background:
    rgba(255,255,255,.035);

  text-align:center;

  font-size:12px;
  font-weight:700;

  letter-spacing:.18em;

  color:#aeb7c2;
}

.mode.want{
  color:#dfc66e;

  border-color:
    rgba(223,198,110,.45);

  background:
    rgba(223,198,110,.06);
}


/* =========================
   MAIN
========================= */

.main{
  min-height:0;

  display:grid;

  grid-template-columns:
    minmax(280px,.88fr)
    minmax(440px,1.45fr);

  gap:22px;
}


/* =========================
   GLASS PANEL
========================= */

.panel{
  min-height:0;

  border:
    1px solid rgba(255,255,255,.10);

  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  box-shadow:
    0 22px 70px rgba(0,0,0,.34);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);
}


/* =========================
   IMAGE
========================= */

.image-panel{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  overflow:hidden;
}

.image-panel::before{
  content:"";

  position:absolute;

  width:300px;
  height:300px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(216,194,110,.10),
      transparent 67%
    );

  filter:blur(10px);
}

.image-area{
  position:relative;
  z-index:2;

  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  transform:translateY(-35px);
}

.card-image{
  display:none;

  max-width:78%;
  max-height:83%;

  object-fit:contain;

  border-radius:16px;

  filter:
    drop-shadow(
      0 20px 28px rgba(0,0,0,.48)
    );
}

.image-placeholder{
  width:72%;
  aspect-ratio:63 / 88;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  border:
    1px solid rgba(255,255,255,.12);

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.04),
      rgba(255,255,255,.012)
    );

  color:#56616e;

  font-size:12px;

  letter-spacing:.17em;
}

.placeholder-circle{
  width:72px;
  height:72px;

  margin-bottom:18px;

  border:
    1px solid rgba(255,255,255,.11);

  border-radius:50%;

  position:relative;
}

.placeholder-circle::after{
  content:"";

  position:absolute;

  top:50%;
  left:0;

  width:100%;

  border-top:
    1px solid rgba(255,255,255,.11);
}


/* =========================
   INFORMATION
========================= */

.info-panel{
  padding:
    25px 29px 22px;

  display:grid;

  grid-template-rows:
    auto
    auto
    auto
    minmax(120px,1fr);

  gap:16px;
}

.card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;

  gap:20px;
}

.card-name{
  font-size:
    clamp(25px,3vw,40px);

  font-weight:750;

  line-height:1.08;

  letter-spacing:.01em;
}

.card-number{
  margin-top:8px;

  font-size:13px;

  color:#737f8e;

  letter-spacing:.13em;
}

.qty{
  padding:
    7px 11px;

  border:
    1px solid rgba(255,255,255,.11);

  border-radius:10px;

  background:
    rgba(255,255,255,.025);

  font-size:11px;

  color:#8994a1;

  white-space:nowrap;
}


/* =========================
   PRICE
========================= */

.price-section{
  padding:
    17px 0 15px;

  border-top:
    1px solid rgba(255,255,255,.07);

  border-bottom:
    1px solid rgba(255,255,255,.07);
}

.price-label{
  font-size:10px;

  letter-spacing:.19em;

  color:#727d8b;
}

.current-price{
  margin-top:4px;

  font-size:
    clamp(38px,5.2vw,66px);

  line-height:1;

  font-weight:760;

  letter-spacing:-.045em;
}

.source{
  margin-top:7px;

  font-size:10px;

  color:#66717f;

  letter-spacing:.12em;
}


/* =========================
   METRICS
========================= */

.metrics{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.metric{
  min-width:0;

  padding:
    13px 14px;

  border:
    1px solid rgba(255,255,255,.075);

  border-radius:15px;

  background:
    rgba(255,255,255,.022);
}

.metric-label{
  margin-bottom:7px;

  font-size:9px;

  letter-spacing:.14em;

  color:#697482;
}

.metric-value{
  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:
    clamp(15px,1.8vw,22px);

  font-weight:680;
}

.positive{
  color:#79cfa0;
}

.negative{
  color:#e48686;
}

.neutral{
  color:#a9b2bd;
}

.gold{
  color:#dfc66e;
}


/* =========================
   CHART
========================= */

.chart-box{
  min-height:0;

  position:relative;

  padding:
    14px 12px 4px;

  border:
    1px solid rgba(255,255,255,.07);

  border-radius:17px;

  background:
    rgba(0,0,0,.13);
}

.chart-title{
  position:absolute;

  top:10px;
  left:15px;

  z-index:2;

  font-size:9px;

  letter-spacing:.16em;

  color:#65717e;
}

#chart{
  width:100%;
  height:100%;
}


/* =========================
   FOOTER
========================= */

.footer{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 5px;

  font-size:10px;

  color:#606b78;

  letter-spacing:.11em;
}

.footer-right{
  display:flex;
  align-items:center;
  gap:12px;
}

.dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#62bd8b;

  box-shadow:
    0 0 10px rgba(98,189,139,.45);
}


/* =========================
   MOBILE
========================= */

@media(
  max-width:760px
){

  .board{
    grid-template-rows:
      60px
      1fr
      38px;

    padding:
      10px;
  }

  .main{
    grid-template-columns:
      .8fr
      1.2fr;

    gap:10px;
  }

  .info-panel{
    padding:
      17px;
  }

  .metrics{
    gap:6px;
  }

  .metric{
    padding:
      10px;
  }

  .brand-title{
    font-size:18px;
  }

}

</style>
</head>


<body>

<div class="board">


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="brand">

    <div class="logo"></div>

    <div>

      <div class="brand-title">
        POKÉMON CARD BOARD
      </div>

      <div class="brand-sub">
        COLLECTION · MARKET TRACKER
      </div>

    </div>

  </div>


  <div
    id="mode"
    class="mode"
  >
    OWNED
  </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="main">


  <!-- IMAGE -->

  <section class="panel image-panel">

    <div class="image-area">

      <img
        id="cardImage"
        class="card-image"
        alt=""
      >

      <div
        id="imagePlaceholder"
        class="image-placeholder"
      >

        <div
          class="placeholder-circle"
        ></div>

        CARD IMAGE

      </div>

    </div>

  </section>


  <!-- INFO -->

  <section class="panel info-panel">


    <div class="card-top">

      <div>

        <div
          id="cardName"
          class="card-name"
        >
          —
        </div>

        <div
          id="cardNumber"
          class="card-number"
        >
          —
        </div>

      </div>


      <div
        id="qty"
        class="qty"
      >
        —
      </div>

    </div>


    <div class="price-section">

      <div class="price-label">
        カードラッシュ相場
      </div>

      <div
        id="currentPrice"
        class="current-price"
      >
        —
      </div>

      <div class="source">
        CARD RUSH · NORMAL CONDITION
      </div>

    </div>


    <div
      id="metrics"
      class="metrics"
    >
    </div>


    <div class="chart-box">

      <div class="chart-title">
        PRICE HISTORY · LAST 30 DAYS
      </div>

      <canvas
        id="chart"
      ></canvas>

    </div>


  </section>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

  <div
    id="count"
  >
    —
  </div>


  <div class="footer-right">

    <span>
      AUTO 16 SEC
    </span>

    <span
      id="clock"
    >
      —
    </span>

    <div class="dot"></div>

  </div>

</footer>


</div>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const ROTATE_MS =
  16000;


/* =========================================================
   DATA
========================================================= */

let data = null;

let physicalCards = [];

let previousOwnedIndex = -1;

let wantedIndex = 0;

let modeCounter = 0;


/* =========================================================
   UTILITIES
========================================================= */

function yen(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(
      Number(value)
    )
  ){
    return "—";
  }

  return (
    "¥" +
    Number(value)
      .toLocaleString(
        "ja-JP"
      )
  );

}


function percentChange(
  current,
  base
){

  if(
    current === null ||
    current === undefined ||
    base === null ||
    base === undefined ||
    Number(base) === 0
  ){
    return null;
  }


  return (
    (
      Number(current) /
      Number(base)
      - 1
    )
    * 100
  );

}


function signedPercent(value){

  if(
    value === null ||
    value === undefined ||
    Number.isNaN(value)
  ){
    return "—";
  }


  const sign =
    value > 0
      ? "+"
      : "";


  return (
    sign +
    value.toFixed(1) +
    "%"
  );

}


function valueClass(value){

  if(
    value === null ||
    value === undefined
  ){
    return "neutral";
  }

  if(value > 0){
    return "positive";
  }

  if(value < 0){
    return "negative";
  }

  return "neutral";

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const now =
    new Date();


  document.getElementById(
    "clock"
  ).textContent =
    now.toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================================================
   OWNED → PHYSICAL CARDS
========================================================= */

function expandOwnedCards(){

  physicalCards = [];


  for(
    const card
    of data.owned || []
  ){

    const qty =
      Math.max(
        1,
        Number(
          card.qty || 1
        )
      );


    const purchasePrices =
      Array.isArray(
        card.purchasePrices
      )
        ? card.purchasePrices
        : [];


    for(
      let i = 0;
      i < qty;
      i++
    ){

      physicalCards.push({

        ...card,

        physicalIndex:
          i + 1,

        physicalQty:
          qty,

        purchasePrice:
          purchasePrices[i]
          ??
          purchasePrices[0]
          ??
          null

      });

    }

  }

}


/* =========================================================
   RANDOM OWNED
========================================================= */

function randomOwned(){

  if(
    physicalCards.length === 0
  ){
    return null;
  }


  if(
    physicalCards.length === 1
  ){

    previousOwnedIndex = 0;

    return physicalCards[0];

  }


  let index;


  do{

    index =
      Math.floor(
        Math.random()
        *
        physicalCards.length
      );

  }while(
    index ===
    previousOwnedIndex
  );


  previousOwnedIndex =
    index;


  return physicalCards[
    index
  ];

}


/* =========================================================
   IMAGE
========================================================= */

function setImage(card){

  const image =
    document.getElementById(
      "cardImage"
    );


  const placeholder =
    document.getElementById(
      "imagePlaceholder"
    );


  if(card.image){

    image.src =
      card.image;

    image.alt =
      card.name || "";

    image.style.display =
      "block";

    placeholder.style.display =
      "none";


    image.onerror = () => {

      image.style.display =
        "none";

      placeholder.style.display =
        "flex";

    };

  }else{

    image.removeAttribute(
      "src"
    );

    image.style.display =
      "none";

    placeholder.style.display =
      "flex";

  }

}


/* =========================================================
   METRIC
========================================================= */

function metricHTML(
  label,
  value,
  className="neutral"
){

  return `
    <div class="metric">

      <div class="metric-label">
        ${label}
      </div>

      <div class="metric-value ${className}">
        ${value}
      </div>

    </div>
  `;

}


/* =========================================================
   OWNED
========================================================= */

function showOwned(){

  const card =
    randomOwned();


  if(!card){
    return;
  }


  const current =
    card.currentPrice
    ?? null;


  const yesterday =
    card.yesterdayPrice
    ?? null;


  const purchase =
    card.purchasePrice
    ?? null;


  const purchaseChange =
    percentChange(
      current,
      purchase
    );


  const dayChange =
    percentChange(
      current,
      yesterday
    );


  /* MODE */

  const mode =
    document.getElementById(
      "mode"
    );

  mode.textContent =
    "OWNED";

  mode.className =
    "mode";


  /* CARD */

  document.getElementById(
    "cardName"
  ).textContent =
    card.name || "—";


  document.getElementById(
    "cardNumber"
  ).textContent =
    card.number || "—";


  document.getElementById(
    "qty"
  ).textContent =
    card.physicalQty > 1
      ? `${card.physicalIndex} / ${card.physicalQty}`
      : "OWNED";


  document.getElementById(
    "currentPrice"
  ).textContent =
    yen(current);


  /* IMAGE */

  setImage(
    card
  );


  /* METRICS */

  document.getElementById(
    "metrics"
  ).innerHTML =

    metricHTML(
      "PURCHASE",
      yen(purchase)
    )

    +

    metricHTML(
      "FROM PURCHASE",
      signedPercent(
        purchaseChange
      ),
      valueClass(
        purchaseChange
      )
    )

    +

    metricHTML(
      "DAY CHANGE",
      signedPercent(
        dayChange
      ),
      valueClass(
        dayChange
      )
    );


  /* FOOTER */

  document.getElementById(
    "count"
  ).textContent =
    `OWNED ${physicalCards.length} CARDS · PRICE ${data.lastUpdated ?? "—"}`;


  /* CHART */

  drawHistoryChart({

    history:
      card.history || [],

    purchase:
      purchase,

    target:
      null

  });

}


/* =========================================================
   WANT
========================================================= */

function showWanted(){

  if(
    !data.wanted ||
    data.wanted.length === 0
  ){
    return;
  }


  const card =
    data.wanted[
      wantedIndex %
      data.wanted.length
    ];


  wantedIndex++;


  const current =
    card.currentPrice
    ?? null;


  const yesterday =
    card.yesterdayPrice
    ?? null;


  const reference =
    card.referencePrice
    ?? null;


  /*
    targetPriceを最優先。
    古いcards.jsonにも対応するため、
    無い場合だけreferencePriceの50%。
  */

  const target =
    card.targetPrice
    ??
    (
      reference !== null
        ? Math.round(
            reference * 0.5
          )
        : null
    );


  const dayChange =
    percentChange(
      current,
      yesterday
    );


  const targetGap =
    (
      current !== null &&
      target !== null &&
      target !== 0
    )
      ? (
          (
            current /
            target
            - 1
          )
          * 100
        )
      : null;


  /* MODE */

  const mode =
    document.getElementById(
      "mode"
    );

  mode.textContent =
    "WANTED";

  mode.className =
    "mode want";


  /* CARD */

  document.getElementById(
    "cardName"
  ).textContent =
    card.name || "—";


  document.getElementById(
    "cardNumber"
  ).textContent =
    card.number || "—";


  document.getElementById(
    "qty"
  ).textContent =
    "WATCH";


  document.getElementById(
    "currentPrice"
  ).textContent =
    yen(current);


  /* IMAGE */

  setImage(
    card
  );


  /* METRICS */

  document.getElementById(
    "metrics"
  ).innerHTML =

    metricHTML(
      "TARGET",
      yen(target),
      "gold"
    )

    +

    metricHTML(
      "TO TARGET",
      signedPercent(
        targetGap
      ),
      targetGap !== null &&
      targetGap <= 0
        ? "positive"
        : "gold"
    )

    +

    metricHTML(
      "DAY CHANGE",
      signedPercent(
        dayChange
      ),
      valueClass(
        dayChange
      )
    );


  /* FOOTER */

  document.getElementById(
    "count"
  ).textContent =
    `WANT ${data.wanted.length} CARDS · PRICE ${data.lastUpdated ?? "—"}`;


  /* CHART */

  drawHistoryChart({

    history:
      card.history || [],

    purchase:
      null,

    target:
      target

  });

}


/* =========================================================
   HISTORY CHART
========================================================= */

function drawHistoryChart({
  history,
  purchase,
  target
}){

  const canvas =
    document.getElementById(
      "chart"
    );


  const rect =
    canvas.getBoundingClientRect();


  const ratio =
    window.devicePixelRatio
    || 1;


  canvas.width =
    Math.max(
      1,
      rect.width * ratio
    );


  canvas.height =
    Math.max(
      1,
      rect.height * ratio
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.scale(
    ratio,
    ratio
  );


  const w =
    rect.width;


  const h =
    rect.height;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  /* =========================
     HISTORY
  ========================= */

  let points =
    Array.isArray(history)
      ? history
          .filter(
            item =>
              item &&
              item.date &&
              item.price !== null &&
              item.price !== undefined &&
              !Number.isNaN(
                Number(
                  item.price
                )
              )
          )
          .map(
            item => ({
              date:
                String(
                  item.date
                ),

              price:
                Number(
                  item.price
                )
            })
          )
          .sort(
            (a,b) =>
              a.date.localeCompare(
                b.date
              )
          )
      : [];


  /*
    直近30記録。
    1日1記録なので、
    通常は30日分になる。
  */

  points =
    points.slice(
      -30
    );


  /* =========================
     VALUE RANGE
  ========================= */

  const values =
    points.map(
      item =>
        item.price
    );


  if(
    purchase !== null &&
    purchase !== undefined
  ){

    values.push(
      Number(
        purchase
      )
    );

  }


  if(
    target !== null &&
    target !== undefined
  ){

    values.push(
      Number(
        target
      )
    );

  }


  if(
    values.length === 0
  ){

    ctx.fillStyle =
      "#606b79";

    ctx.font =
      "14px -apple-system";


    ctx.fillText(
      "価格履歴が蓄積されると表示します",
      20,
      h / 2
    );


    return;

  }


  let min =
    Math.min(
      ...values
    );


  let max =
    Math.max(
      ...values
    );


  const spread =
    Math.max(
      max - min,
      max * 0.10,
      100
    );


  min -=
    spread * 0.18;


  max +=
    spread * 0.18;


  const left =
    15;

  const right =
    20;

  const top =
    31;

  const bottom =
    28;


  const graphW =
    Math.max(
      1,
      w - left - right
    );


  const graphH =
    Math.max(
      1,
      h - top - bottom
    );


  const y =
    value =>
      top +
      (
        (
          max - value
        )
        /
        (
          max - min
        )
      )
      *
      graphH;


  /* =========================
     GRID
  ========================= */

  ctx.strokeStyle =
    "rgba(255,255,255,.065)";


  ctx.lineWidth =
    1;


  for(
    let i = 0;
    i < 4;
    i++
  ){

    const gy =
      top +
      graphH *
      (
        i / 3
      );


    ctx.beginPath();


    ctx.moveTo(
      left,
      gy
    );


    ctx.lineTo(
      w - right,
      gy
    );


    ctx.stroke();

  }


  /* =========================
     PURCHASE LINE
  ========================= */

  if(
    purchase !== null &&
    purchase !== undefined
  ){

    const py =
      y(
        Number(
          purchase
        )
      );


    ctx.strokeStyle =
      "rgba(255,255,255,.36)";


    ctx.lineWidth =
      1;


    ctx.setLineDash(
      [6,6]
    );


    ctx.beginPath();


    ctx.moveTo(
      left,
      py
    );


    ctx.lineTo(
      w - right,
      py
    );


    ctx.stroke();


    ctx.setLineDash(
      []
    );


    ctx.fillStyle =
      "#9da7b3";


    ctx.font =
      "10px -apple-system";


    ctx.fillText(
      "PURCHASE " +
      yen(
        purchase
      ),
      left + 5,
      Math.max(
        12,
        py - 6
      )
    );

  }


  /* =========================
     TARGET LINE
  ========================= */

  if(
    target !== null &&
    target !== undefined
  ){

    const ty =
      y(
        Number(
          target
        )
      );


    ctx.strokeStyle =
      "#d4b85f";


    ctx.lineWidth =
      1.2;


    ctx.setLineDash(
      [7,6]
    );


    ctx.beginPath();


    ctx.moveTo(
      left,
      ty
    );


    ctx.lineTo(
      w - right,
      ty
    );


    ctx.stroke();


    ctx.setLineDash(
      []
    );


    ctx.fillStyle =
      "#dfc66e";


    ctx.font =
      "10px -apple-system";


    ctx.fillText(
      "TARGET " +
      yen(
        target
      ),
      left + 5,
      Math.max(
        12,
        ty - 6
      )
    );

  }


  /* =========================
     NO HISTORY
  ========================= */

  if(
    points.length === 0
  ){

    ctx.fillStyle =
      "#606b79";


    ctx.font =
      "13px -apple-system";


    ctx.fillText(
      "履歴収集中",
      left + 5,
      h / 2
    );


    return;

  }


  /* =========================
     ONE DAY
  ========================= */

  if(
    points.length === 1
  ){

    const point =
      points[0];


    const px =
      left +
      graphW * .72;


    const py =
      y(
        point.price
      );


    ctx.fillStyle =
      "#f2f4f7";


    ctx.beginPath();


    ctx.arc(
      px,
      py,
      5,
      0,
      Math.PI * 2
    );


    ctx.fill();


    ctx.fillStyle =
      "#737e8c";


    ctx.font =
      "10px -apple-system";


    ctx.fillText(
      point.date.slice(
        5
      ),
      px - 15,
      h - 7
    );


    ctx.fillStyle =
      "#e8ecf1";


    ctx.font =
      "12px -apple-system";


    ctx.fillText(
      yen(
        point.price
      ),
      Math.max(
        left,
        px - 24
      ),
      Math.max(
        14,
        py - 11
      )
    );


    return;

  }


  /* =========================
     PRICE LINE
  ========================= */

  const xForIndex =
    index =>
      left +
      graphW *
      (
        index /
        (
          points.length - 1
        )
      );


  ctx.strokeStyle =
    "#e2e7ef";


  ctx.lineWidth =
    2.4;


  ctx.lineJoin =
    "round";


  ctx.lineCap =
    "round";


  ctx.beginPath();


  points.forEach(
    (
      point,
      index
    ) => {

      const px =
        xForIndex(
          index
        );


      const py =
        y(
          point.price
        );


      if(index === 0){

        ctx.moveTo(
          px,
          py
        );

      }else{

        ctx.lineTo(
          px,
          py
        );

      }

    }
  );


  ctx.stroke();


  /* =========================
     LAST POINT
  ========================= */

  const lastIndex =
    points.length - 1;


  const last =
    points[
      lastIndex
    ];


  const lastX =
    xForIndex(
      lastIndex
    );


  const lastY =
    y(
      last.price
    );


  ctx.fillStyle =
    "#ffffff";


  ctx.beginPath();


  ctx.arc(
    lastX,
    lastY,
    5,
    0,
    Math.PI * 2
  );


  ctx.fill();


  /* =========================
     DATES
  ========================= */

  const first =
    points[0];


  ctx.fillStyle =
    "#6f7a89";


  ctx.font =
    "10px -apple-system";


  ctx.fillText(
    first.date.slice(
      5
    ),
    left,
    h - 7
  );


  const lastDate =
    last.date.slice(
      5
    );


  ctx.fillText(
    lastDate,
    Math.max(
      left,
      w - right - 31
    ),
    h - 7
  );


  /* =========================
     CURRENT PRICE LABEL
  ========================= */

  ctx.fillStyle =
    "#ffffff";


  ctx.font =
    "11px -apple-system";


  const priceText =
    yen(
      last.price
    );


  const textWidth =
    ctx.measureText(
      priceText
    ).width;


  ctx.fillText(
    priceText,
    Math.min(
      w - right - textWidth,
      Math.max(
        left,
        lastX - textWidth - 8
      )
    ),
    Math.max(
      14,
      lastY - 10
    )
  );

}


/* =========================================================
   ROTATION
========================================================= */

function showNext(){

  /*
    3画面単位

    0 OWNED
    1 OWNED
    2 WANT

    → 2:1
  */

  const wantTurn =
    (
      modeCounter % 3
      === 2
    );


  if(
    wantTurn &&
    data.wanted &&
    data.wanted.length
  ){

    showWanted();

  }else{

    showOwned();

  }


  modeCounter++;

}


/* =========================================================
   START
========================================================= */

async function start(){

  try{

    const response =
      await fetch(
        "cards.json?ts="
        +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "cards.json load failed"
      );

    }


    data =
      await response.json();


    expandOwnedCards();


    showNext();


    setInterval(
      showNext,
      ROTATE_MS
    );


    updateClock();


    setInterval(
      updateClock,
      30000
    );


    window.addEventListener(
      "resize",
      () => {

        /*
          リサイズ後は
          現在モードの次カードを再描画。
        */

        if(
          document
            .getElementById(
              "mode"
            )
            .classList
            .contains(
              "want"
            )
        ){

          /*
            wantedIndexはshowWanted内で
            +1されるため1つ戻す。
          */

          wantedIndex =
            Math.max(
              0,
              wantedIndex - 1
            );


          showWanted();

        }else{

          /*
            resizeではランダムカードを
            変えない方が理想だが、
            通常iPad固定表示では
            ほぼ発生しないため簡略化。
          */

          showOwned();

        }

      }
    );


  }catch(error){

    console.error(
      error
    );


    document.getElementById(
      "cardName"
    ).textContent =
      "DATA ERROR";


    document.getElementById(
      "cardNumber"
    ).textContent =
      "cards.json を確認してください";

  }

}


/* =========================================================
   RUN
========================================================= */

start();

</script>
